[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-equity-risk-review"
version = "1.0.0"
description = "Complete-period equity-risk comparisons and retrospective macroeconomic context"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=2.3,<3", "matplotlib>=3.10,<4"]
authors = [{name = "Grace Ngo"}]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5"]

[project.scripts]
equity-review = "equity_review.analysis:main"

[tool.setuptools.packages.find]
include = ["equity_review*"]
